<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Anti-Guru Challenge</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const App = () => {
          const [day, setDay] = useState(0);
          const [data, setData] = useState({});
          const [checks, setChecks] = useState({});

          useEffect(() => {
            const d = localStorage.getItem('antiguru-data');
            const c = localStorage.getItem('antiguru-checks');
            if (d) setData(JSON.parse(d));
            if (c) setChecks(JSON.parse(c));
          }, []);

          useEffect(() => localStorage.setItem('antiguru-data', JSON.stringify(data)), [data]);
          useEffect(() => localStorage.setItem('antiguru-checks', JSON.stringify(checks)), [checks]);

          const update = (k, v) => setData(p => ({ ...p, [k]: v }));
          const toggle = (k) => setChecks(p => ({ ...p, [k]: !p[k] }));

          const exportData = () => {
            const blob = new Blob([JSON.stringify({ data, checks }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'antiguru.json';
            a.click();
          };

          const reset = () => {
            if (confirm('Alles löschen?')) {
              setData({});
              setChecks({});
              localStorage.clear();
            }
          };

          const progress = Math.round((Object.values(checks).filter(v => v).length / 18) * 100);

          const bgs = ['./images/day0.png','./images/day1.png','./images/day2.png','./images/day3.png','./images/day4.png','./images/day5.png','./images/day6.png','./images/day7.png','./images/day8.png','./images/day0.png'];

          const T = ({p,k,r=3}) => <textarea placeholder={p} value={data[k]||''} onChange={e=>update(k,e.target.value)} rows={r}/>;
          const I = ({p,k}) => <input type="text" placeholder={p} value={data[k]||''} onChange={e=>update(k,e.target.value)}/>;
          const C = ({k,t}) => <label className="check"><input type="checkbox" checked={checks[k]||false} onChange={()=>toggle(k)}/><span>{t}</span></label>;

          const pages = [
            {t:"Start",c:<><h1>Die Anti-Guru Challenge</h1><p className="sub">9 Tage. Kein Mindset-Bullshit. Nur Verkaufen.</p><div className="box"><h2>Was du bekommst:</h2><ul><li>Glasklare Positionierung</li><li>Verkaufbares Angebot (250-750€)</li><li>7-Tage-Content-Plan</li><li>Mini-Funnel</li><li>Sales-Skript</li><li>Skalierungs-Blueprint</li></ul><p className="em">Keine Ausreden mehr.</p></div><button onClick={()=>setDay(1)} className="cta">Challenge starten</button></>},
            {t:"Tag 1",c:<><h2>Mindset-Shift</h2><div className="q"><h3>Glaubenssätze identifizieren</h3><T p="Was hält dich zurück?" k="g1"/></div><div className="q"><h3>Glaubenssätze kippen</h3><T p="Neue Überzeugungen..." k="g2"/></div><div className="q"><h3>Mikro-Manifest</h3><T p="Mein Manifest..." k="g3"/></div><div className="cp"><C k="c1a" t="Glaubenssätze identifiziert"/><C k="c1b" t="Neue Überzeugungen"/><C k="c1c" t="Manifest geschrieben"/></div></>},
            {t:"Tag 2",c:<><h2>Deine Story</h2><div className="q"><h4>1. Wo warst du?</h4><T p="Tiefpunkt..." k="s1"/></div><div className="q"><h4>2. Wendepunkt</h4><T p="Was hat sich verändert?" k="s2"/></div><div className="q"><h4>3. Wo jetzt?</h4><T p="Transformation..." k="s3"/></div><div className="q"><h4>4. Gelernt</h4><T p="Lektion..." k="s4"/></div><div className="q"><h4>5. Wen hilfst du?</h4><T p="Zielgruppe..." k="s5"/></div><div className="cp"><C k="c2a" t="Story formuliert"/><C k="c2b" t="Zielgruppe beschrieben"/></div></>},
            {t:"Tag 3",c:<><h2>30-Sekunden-Pitch</h2><div className="formula">Ich helfe [Zielgruppe], [Problem], damit sie [Ergebnis].</div><div className="q"><T p="Ich helfe..." k="p1"/></div><div className="q"><h4>Einzigartigkeit</h4><T p="Was macht dich anders?" k="p2"/></div><div className="q"><h4>Finale Version</h4><T p="Ich helfe..." k="p3"/></div><div className="cp"><C k="c3a" t="Pitch formuliert"/><C k="c3b" t="Einzigartigkeit definiert"/><C k="c3c" t="Laut vorgelesen (3x)"/></div></>},
            {t:"Tag 4",c:<><h2>Einstiegsangebot</h2><div className="q"><h4>1. Problem</h4><T p="Welches Problem löst du?" k="a1"/></div><div className="q"><h4>2. Leistungen</h4><T p="Was bekommt der Kunde?" k="a2" r={4}/></div><div className="q"><h4>3. Ergebnis</h4><T p="Was wird messbar anders?" k="a3"/></div><div className="q"><h4>4. Preis</h4><I p="€ 497" k="a4"/></div><div className="cp"><C k="c4a" t="Problem definiert"/><C k="c4b" t="Leistungen aufgelistet"/><C k="c4c" t="Ergebnis & Preis"/></div></>},
            {t:"Tag 5",c:<><h2>Content-Plan</h2>{[1,2,3,4,5,6,7].map(n=><div key={n} className="q"><h4>Tag {n}</h4><T p="Content-Idee..." k={`ct${n}`} r={2}/></div>)}<div className="cp"><C k="c5a" t="7 Ideen notiert"/><C k="c5b" t="Strategie klar"/></div></>},
            {t:"Tag 6",c:<><h2>Mini-Funnel</h2><div className="q"><h4>1. Headline</h4><I p="Was bekommt der Kunde?" k="f1"/></div><div className="q"><h4>2. Problem</h4><T p="Problem..." k="f2"/></div><div className="q"><h4>3. Lösung</h4><T p="Lösung..." k="f3"/></div><div className="q"><h4>4. CTA</h4><I p="Buche jetzt..." k="f4"/></div><div className="cp"><C k="c6a" t="Landing definiert"/><C k="c6b" t="CTA formuliert"/></div></>},
            {t:"Tag 7",c:<><h2>Erstgespräch</h2>{['Rapport','Problem','Vision','Angebot','Einwände'].map((ph,i)=><div key={i} className="q"><h4>Phase {i+1}: {ph}</h4><T p={ph+"..."} k={`sl${i}`} r={2}/></div>)}<div className="cp"><C k="c7a" t="Phasen verstanden"/><C k="c7b" t="Fragen notiert"/><C k="c7c" t="Einwände vorbereitet"/></div></>},
            {t:"Tag 8",c:<><h2>Skalierung</h2><div className="q"><h4>Roadmap</h4><T p="Nächste Schritte..." k="sc1" r={6}/></div><div className="cp"><C k="c8a" t="Stufen verstanden"/><C k="c8b" t="Schritte definiert"/></div></>},
            {t:"Tag 9",c:<><h2>Launch</h2><div className="cp">{["Positionierung","Angebot","Content","Landing","Sales","Roadmap","Post"].map((t,i)=><C key={i} k={`c9${String.fromCharCode(97+i)}`} t={t}/>)}</div><div className="q"><h4>Verpflichtung</h4><I p="Unterschrift..." k="sig"/></div><div className="done"><h2>Challenge abgeschlossen! 🖤</h2><p>Jetzt: Umsetzen. Verkaufen.</p></div></>}
          ];

          return (
            <div className="app" style={{backgroundImage:`url(${bgs[day]})`}}>
              <style>{`
                @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap');
                *{margin:0;padding:0;box-sizing:border-box}
                body{font-family:'Jost',sans-serif;overflow-x:hidden}
                .app{min-height:100vh;background-size:cover;background-position:center;background-attachment:fixed;transition:background 0.8s ease}
                .app::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,rgba(0,0,0,0.15),rgba(0,0,0,0.25));pointer-events:none;z-index:0}
                .header{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(0,0,0,0.6);border-bottom:1px solid rgba(255,255,255,0.15);padding:16px 0}
                .hc{max-width:680px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
                .brand{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:#fff;letter-spacing:1px}
                .acts{display:flex;gap:10px}
                .btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:500;border-radius:3px;transition:0.2s}
                .btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-1px)}
                .prog{max-width:680px;margin:0 auto;padding:16px 20px;position:relative;z-index:1}
                .plabel{font-size:12px;color:#fff;margin-bottom:6px;text-align:right;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
                .pbar{height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden}
                .pfill{height:100%;background:#fff;transition:0.4s}
                .nav{background:rgba(0,0,0,0.5);backdrop-filter:blur(15px);overflow-x:auto;position:sticky;top:60px;z-index:90;border-bottom:1px solid rgba(255,255,255,0.1)}
                .ntabs{display:flex;max-width:680px;margin:0 auto;padding:0 20px}
                .ntab{background:none;border:none;color:rgba(255,255,255,0.6);padding:14px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:0.2s}
                .ntab:hover{color:rgba(255,255,255,0.9)}
                .ntab.active{color:#fff;border-bottom-color:#fff;font-weight:600}
                .content{max-width:680px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1}
                h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:#fff;margin-bottom:12px;text-shadow:0 4px 20px rgba(0,0,0,0.8)}
                h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:#fff;margin-bottom:20px;text-shadow:0 3px 15px rgba(0,0,0,0.7)}
                h3{font-size:18px;font-weight:600;color:#fff;margin-bottom:10px;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
                h4{font-size:15px;font-weight:600;color:rgba(255,255,255,0.95);margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
                p{color:rgba(255,255,255,0.9);line-height:1.6;margin-bottom:12px;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
                .sub{font-size:20px;color:rgba(255,255,255,0.85);margin-bottom:28px;font-weight:400}
                .em{font-weight:600;color:#fff!important;font-size:18px}
                .box,.formula{background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);padding:24px;border-radius:6px;margin:24px 0}
                .formula{font-style:italic;border-left:3px solid #fff;font-size:16px;color:rgba(255,255,255,0.95)}
                ul{list-style:none;margin:20px 0}
                li{padding:8px 0 8px 24px;position:relative;color:rgba(255,255,255,0.95);font-size:15px}
                li:before{content:'→';position:absolute;left:0;color:#fff;font-weight:600}
                .q{margin:20px 0}
                textarea,input[type="text"]{width:100%;background:rgba(0,0,0,0.2);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:14px;font-family:'Jost',sans-serif;font-size:14px;line-height:1.6;margin:8px 0 16px;resize:vertical;min-height:90px;border-radius:4px;transition:0.3s}
                textarea::placeholder,input::placeholder{color:rgba(255,255,255,0.5)}
                textarea:focus,input:focus{outline:none;border-color:rgba(255,255,255,0.6);background:rgba(0,0,0,0.3);transform:scale(1.01)}
                input[type="text"]{min-height:auto;padding:12px 14px}
                .cp{background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);padding:20px;border-radius:6px;margin-top:32px}
                .check{display:flex;align-items:center;padding:12px 0;cursor:pointer;color:rgba(255,255,255,0.9);transition:0.2s;font-size:14px}
                .check:hover{color:#fff;transform:translateX(3px)}
                .check span{text-shadow:0 2px 8px rgba(0,0,0,0.6)}
                input[type="checkbox"]{width:18px;height:18px;margin-right:12px;cursor:pointer;accent-color:#fff}
                .done{text-align:center;padding:50px 0;margin-top:50px;border-top:1px solid rgba(255,255,255,0.2)}
                .cta{background:#fff;color:#000;font-family:'Jost',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:16px 40px;border:none;border-radius:4px;cursor:pointer;margin-top:28px;transition:0.3s;box-shadow:0 8px 20px rgba(0,0,0,0.5)}
                .cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 28px rgba(0,0,0,0.7)}
                @media(max-width:768px){
                  h1{font-size:32px}
                  h2{font-size:26px}
                  .content{padding:30px 16px 60px}
                  .hc,.ntabs,.prog{padding:0 16px}
                }
              `}</style>

              <div className="header">
                <div className="hc">
                  <div className="brand">RE:BELLE™</div>
                  <div className="acts">
                    <button onClick={exportData} className="btn">Export</button>
                    <button onClick={reset} className="btn">Reset</button>
                  </div>
                </div>
              </div>

              <div className="prog">
                <div className="plabel">{progress}%</div>
                <div className="pbar"><div className="pfill" style={{width:`${progress}%`}}/></div>
              </div>

              <div className="nav">
                <div className="ntabs">
                  {pages.map((p,i)=><button key={i} className={`ntab ${day===i?'active':''}`} onClick={()=>setDay(i)}>{p.t}</button>)}
                </div>
              </div>

              <div className="content">{pages[day].c}</div>
            </div>
          );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
